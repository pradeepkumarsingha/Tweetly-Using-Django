
{% extends "layouts.html" %}

{% block title %}Delete Tweet | Tweetly{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow border-0 p-4 mx-auto text-center"
         style="max-width: 500px;">

        <div class="display-3">🗑️</div>

        <h2 class="fw-bold mt-3">Delete Tweet?</h2>

        <p class="text-secondary">
            Are you sure you want to delete this tweet?
            This action cannot be undone.
        </p>

        <div class="bg-light rounded p-3 mb-4">
            {{ tweet.text }}

            {% if tweet.photo %}
                <img src="{{ tweet.photo.url }}"
                     class="img-fluid rounded mt-3"
                     style="max-height: 180px;">
            {% endif %}
        </div>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger w-100">
                Yes, Delete
            </button>
        </form>

        <a href="{% url 'tweet_list' %}"
           class="btn btn-outline-secondary mt-2">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
